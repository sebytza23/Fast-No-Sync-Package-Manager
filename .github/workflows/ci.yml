name: CI
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - name: Install pinned native package managers
              shell: bash
              run: |
                  npm install --prefix "$RUNNER_TEMP/fnspm-managers" --no-audit --no-fund @yarnpkg/cli-dist@4.18.1 deno@2.9.6 pnpm@12.9.1 bun@1.4.2
                  echo "$RUNNER_TEMP/fnspm-managers/node_modules/.bin" >> "$GITHUB_PATH"
            - run: npm run format:check
            - run: npm run check
            - run: npm test
            - run: npm run test:package
            - run: node scripts/test-managers.cjs npm yarn pnpm bun deno
            - run: npm audit --audit-level=high
